name: Newman Contract Tests — team-core

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint all OpenAPI contracts
        run: npm run lint:contracts

      - name: Start Core Business mock server (port 4010)
        run: nohup npx prism mock contracts/core-business.openapi.yaml -p 4010 --host 0.0.0.0 > prism-core.log 2>&1 &

      - name: Start AI Vision mock server (port 4011)
        run: nohup npx prism mock contracts/ai-vision.openapi.yaml -p 4011 --host 0.0.0.0 > prism-vision.log 2>&1 &

      - name: Start IoT Ingestion mock server (port 4012)
        run: nohup npx prism mock contracts/iot-ingestion.openapi.yaml -p 4012 --host 0.0.0.0 > prism-iot.log 2>&1 &

      - name: Wait for all mock servers to be ready
        run: |
          for port in 4010 4011 4012; do
            echo "Waiting for port $port..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:$port/health > /dev/null 2>&1; then
                echo "Port $port is ready"
                break
              fi
              sleep 2
            done
          done

      - name: Run Newman — team-core mock environment
        run: npm run test:core:mock

      - name: Generate HTML report
        run: npm run test:core:html
        continue-on-error: true

      - name: Show Prism logs on failure
        if: failure()
        run: |
          cat prism-core.log || true
          cat prism-vision.log || true
          cat prism-iot.log || true

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports-team-core
          path: reports/
